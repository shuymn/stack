name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

env:
  # Windows runners already ship MinGW gcc for cgo; skip the local-development copy.
  MISE_DISABLE_TOOLS: github:brechtsanders/winlibs_mingw

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Windows job takes up to about 20 minutes on slow runners (about 13 on fast ones).
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14

      - name: Lint and test (Unix)
        if: runner.os != 'Windows'
        run: mise exec -- bash scripts/test

      # One command per step: a multi-line pwsh script reports only its last command's exit code.
      - name: Vet (Windows)
        if: runner.os == 'Windows'
        run: mise exec -- go vet ./...

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: mise exec -- go test -race ./...

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: mise exec -- go build -o stack.exe ./cmd/stack

      - name: Run (Windows)
        if: runner.os == 'Windows'
        run: ./stack.exe --version

  # The PowerShell oracle (docs/design/powershell-guard.md §3, C11): the recognizer against the
  # runner's PowerShell engines (5.1 and 7 on Windows, 7 on Linux and macOS). Not required: `check`
  # does not need it. It fails on any fail or inconclusive verdict, including a missing engine.
  powershell-oracle:
    name: PowerShell oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14

      - name: Oracle
        env:
          STACK_PS_ORACLE: "1"
        run: mise exec -- go test -count=1 -v -run "^TestOracle$" ./internal/powershell/

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs:
      - test
    steps:
      - run: echo "all matrix checks passed"
