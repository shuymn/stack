version: "2"
linters:
  default: all
  disable:
    - cyclop
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - funlen
    - godot
    - ireturn
    - lll
    - nlreturn
    - paralleltest
    - varnamelen
    - wsl
    - gocognit
    - contextcheck
    - wsl_v5
    - noinlineerr
    - gochecknoglobals
    - goconst
    - gomodguard
    - testpackage
  settings:
    depguard:
      rules:
        extensions:
          files:
            - "**/extensions/**"
            - "!**/extensions/guard/**"
            - "!$test"
          deny:
            - pkg: github.com/shuymn/stack/internal
              desc: extensions use only the extension protocol and the documented CLI
        extension-guard:
          list-mode: lax
          files:
            - "**/extensions/guard/**"
            - "!$test"
          allow:
            - github.com/shuymn/stack/internal/shell$
            - github.com/shuymn/stack/internal/ghargs$
            - github.com/shuymn/stack/internal/paths$
            - github.com/shuymn/stack/internal/hookio$
          deny:
            - pkg: github.com/shuymn/stack/internal
              desc: stack-guard shares only the shell, gh, path and hook packages with core
        extension-tests:
          list-mode: lax
          files:
            - "**/extensions/**_test.go"
          allow:
            - github.com/shuymn/stack/internal/proc/proctest$
            - github.com/shuymn/stack/internal/gittest$
          deny:
            - pkg: github.com/shuymn/stack/internal
              desc: extension tests may import only proctest and gittest from core
        core:
          files:
            - "**/cmd/**"
            - "**/internal/**"
            - "!**/extensions/**"
          deny:
            - pkg: github.com/shuymn/stack/extensions
              desc: core must not depend on extensions
    nolintlint:
      require-explanation: true
      require-specific: true
    mnd:
      ignored-numbers:
        - "0o600"
        - "0o644"
        - "0o700"
        - "0o755"
    wrapcheck:
      ignore-package-globs:
        - github.com/shuymn/stack/*
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      - linters:
          - err113
          - noctx
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go
        text: G204
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  exclusions:
    warn-unused: true
