min_version = "2026.10.3"

[settings]
lockfile_platforms = ["macos-arm64", "linux-x64", "windows-x64"]
minimum_release_age = "1d"

[tool_config]
locked = true

# Each tool tracks its major version; mise.lock pins the exact versions and
# .github/workflows/mise-update.yml advances it.
[tools]
go = "1"
golangci-lint = "2"
lefthook = "2"
actionlint = "1"
betterleaks = "1"
"github:suzuki-shunsuke/ghalint" = "1"
# No Windows release. Windows is a CI-only runtime target, and without this
# restriction mise on Windows still resolves the tool while installing go.
"github:shuymn/pommitlint" = { version = "2", os = ["macos", "linux"] }
"github:babarot/gh-infra" = "0"
# MinGW-w64 gcc for cgo, which `go test -race` needs on Windows (CI runners ship
# their own). Pinned exactly: the repository's tags mix the ucrt and msvcrt
# runtimes, so a fuzzy version could resolve to a release without this asset.
"github:brechtsanders/winlibs_mingw" = { version = "16.2.0posix-23.1.3-14.0.0-ucrt-r3", os = ["windows"], asset_pattern = "winlibs-x86_64-posix-seh-gcc-*-mingw-w64ucrt-*.zip", bin_path = "mingw64/bin" }
